<div class="rct-server-decision-analysis" data-decision-package-id="{{ package.id }}">
  <style>
    .rct-server-decision-analysis {
      display: grid;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .rct-server-decision-analysis img {
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      display: block;
      min-height: 10rem;
      width: 100%;
    }
    .rct-server-decision-metrics {
      color: #6c757d;
      display: grid;
      font-size: 0.8125rem;
      gap: 0.25rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .rct-server-decision-metrics span {
      overflow-wrap: anywhere;
    }
    .rct-server-decision-opinion {
      color: #495057;
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
  </style>
  <div class="rct-server-decision-opinion">{{ analysis.opinion }}</div>
  <img src="{{ image_url }}" alt="{{ package.label }} plot">
  <div class="rct-server-decision-metrics">
    {% for key, value in analysis.metrics.items() %}
      <span>{{ key|replace("_", " ") }}: {{ value }}</span>
    {% endfor %}
  </div>
</div>
