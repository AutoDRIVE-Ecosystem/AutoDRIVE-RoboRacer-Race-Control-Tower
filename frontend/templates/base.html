        visibility: hidden;
        z-index: 2;
      }

      .rct-canvas-recenter {
        bottom: 0.75rem;
        opacity: 0;
        pointer-events: none;
        position: absolute;
        right: 0.75rem;
        transition: opacity 0.2s ease;
        visibility: hidden;
        z-index: 2;
      }

      .rct-canvas-controls.is-visible,
      .rct-canvas-recenter.is-visible {
        opacity: 1;
        pointer-events: auto;
        visibility: visible;
      }

      .rct-canvas-recenter[hidden] {
        display: none;
      }

      .rct-canvas-control-label {
        align-items: center;
        background-color: rgba(0, 0, 0, 0.55);
        border-radius: 6px;
        color: #f8f9fa;
        display: inline-flex;
        font-size: 0.875rem;
        line-height: 1;
        padding: 0.25rem 0.5rem;
      }

      .rct-canvas-controls .btn,
      .rct-canvas-recenter {
        border-radius: 6px;
      }

      .rct-canvas-controls .btn-group {
        border-radius: 6px;
      }

      .rct-canvas-controls .btn {
        min-width: 3rem;
      }

      .rct-canvas-recenter {
        min-width: 6.5rem;
      }

      {% block page_styles %}{% endblock %}

    </style>
  </head>
